name: DeepSeek Issue Bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  deepseek-response:
    if: >-
      github.event.issue.number == 22 &&
      startsWith(github.event.comment.body, '/deepseek')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: deepseek-flash
      DEEPSEEK_TARGET_ISSUE: '22'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run bridge tests
        run: npm test

      - name: Ask DeepSeek and post response
        run: node bridge/deepseek_issue_bridge.mjs
