name: DeepSeek Issue Bridge

on:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - 'bridge/deepseek_issue_bridge.mjs'
      - 'test/deepseek_issue_bridge.test.mjs'
      - '.github/workflows/deepseek-issue-bridge.yml'
      - 'package.json'

permissions:
  contents: read
  issues: write
  models: read

jobs:
  bridge-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run bridge tests
        run: npm test

  deepseek-response:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 22 &&
      startsWith(github.event.comment.body, '/deepseek')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: deepseek-flash
      DEEPSEEK_GITHUB_MODEL: deepseek/deepseek-r1-0528
      DEEPSEEK_TARGET_ISSUE: '22'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run bridge tests
        run: npm test

      - name: Ask DeepSeek and post response
        run: node bridge/deepseek_issue_bridge.mjs
