name: ChatGPT Issue Bridge

on:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - 'bridge/chatgpt_issue_bridge.mjs'
      - 'bridge/issue_bridge_common.mjs'
      - 'test/chatgpt_issue_bridge.test.mjs'
      - '.github/workflows/chatgpt-issue-bridge.yml'
      - 'package.json'

permissions:
  contents: read
  issues: write

jobs:
  bridge-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run bridge tests
        run: npm test

  chatgpt-response:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 22 &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/chatgpt')
    concurrency:
      group: chatgpt-issue-bridge
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_TARGET_ISSUE: '22'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run bridge tests
        run: npm test

      - name: Ask ChatGPT and post response
        run: node bridge/chatgpt_issue_bridge.mjs
